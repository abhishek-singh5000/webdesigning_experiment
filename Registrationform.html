<html>
    <head>
        <title>Registration Form</title>
    </head>
    <body align="center" bgcolor="lightpink">
        <h1> Student Registration Form</h1>
        <form>
            <label for="roll_number">Roll Number:</label>
            <input type="number" id="roll_number" name="roll_number" required><br><br>
            <label for="name"> Student Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="Father's Name">Father's Name:</label>
            <input type="text" id="Father's Name" name="Father's Name" required><br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required><br><br>
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="btech">B.Tech</option>
                <option value="mtech">M.Tech</option>
                <option value="mba">MBA</option>
                <option value="phd">PhD</option>
            </select><br><br>
            <label for="Department" >Department:</label>
             <input type="checkbox" id="Department" name="Department" value="CSE">
            <label for="Department">CSE</label>
            <input type="checkbox" id="Department" name="Department" value="ECE">
            <label for="Department">ECE</label>
            <input type="checkbox" id="Department" name="Department" value="ME">
            <label for="Department">ME</label>
            <input type="checkbox" id="Department" name="Department" value="CE">
            <label for="Department">CE</label>
            </select><br><br>
            <label for="student photo" >Student Photo:</label>
            <input type="file" id="student photo" name="student photo" accept="image/*" required><br><br>
            <label for="Address">Address:</label>
            <textarea id="Address" name="Address" rows="4" cols="40" required></textarea><br><br>
            <label for="City">City:</label>
            <input type="text" id="City" name="City" required><br><br>
            <label for="State">State:</label>
            <select id="State" name="State" required>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="West Bengal">West Bengal</option>
                <option value="Bihar">Bihar</option>
            </select><br><br>
            <label for="Country">Country:</label>
            <input type="text" id="Country" name="Country" required><br><br>
            <label for="pin_code">Pin Code:</label>
            <input type="text" id="pin_code" name="pin_code" required><br><br>


            <input type="submit" value="Register">
        </form>
    </body>
</html>
